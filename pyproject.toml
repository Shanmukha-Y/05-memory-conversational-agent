[project]
name = "memagent"
version = "0.1.0"
description = "Conversational agent with two-tier memory: rolling buffer + long-term recall"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "ollama>=0.4.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
mem = "memagent.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memagent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
timeout = 120
markers = [
    "integration: live tests that hit a running Ollama server",
]
